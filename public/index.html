<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 820px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    h2 { margin: 0 0 14px; font-size: 21px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice, .panel { margin: 24px 0; padding: 18px; border-radius: 14px; }
    .notice { border: 1px solid #d07384; color: #ffe3e8; background: #612a3544; }
    .panel { border: 1px solid #51667c; background: #152438; }
    .grid { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; color: #dbe9f7; font-size: 14px; }
    input, textarea, button { font: inherit; }
    input, textarea { box-sizing: border-box; width: 100%; border: 1px solid #51667c; border-radius: 10px; background: #0f1b2a; color: #ecf4ff; padding: 11px 12px; }
    textarea { min-height: 110px; resize: vertical; }
    button { border: 0; border-radius: 10px; padding: 10px 13px; background: #8ad8df; color: #0a1724; font-weight: 700; cursor: pointer; }
    button.secondary { background: #31465d; color: #ecf4ff; }
    button.danger { background: #7e3643; color: #fff2f4; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; }
    .status { min-height: 24px; margin-top: 12px; color: #bfd0e5; }
    .status.error { color: #ffb6c2; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; white-space: pre-wrap; }
    .note-actions { margin-top: 13px; display: flex; gap: 8px; flex-wrap: wrap; }
    .note-actions button { font-size: 14px; padding: 8px 10px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div>
    <h1>내 자료실</h1>
    <p>Supabase Auth로 로그인하고, 서버가 검증한 사용자 ID를 기준으로 내 가상 메모 목록과 추가 작업을 처리합니다.</p>

    <section class="panel" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <form id="login-form" class="grid">
        <label>이메일
          <input id="email" name="email" type="email" autocomplete="username" required>
        </label>
        <label>비밀번호
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="actions">
          <button id="login-button" type="submit">로그인</button>
          <button id="logout-button" class="secondary" type="button" hidden>로그아웃</button>
        </div>
      </form>
      <div id="auth-status" class="status" aria-live="polite">로그아웃 상태입니다.</div>
    </section>

    <section id="editor-panel" class="panel" hidden aria-labelledby="editor-title">
      <h2 id="editor-title">가상 메모 추가</h2>
      <form id="note-form" class="grid">
        <label>제목
          <input id="note-title" maxlength="200" required>
        </label>
        <label>내용
          <textarea id="note-body" maxlength="5000" required></textarea>
        </label>
        <div class="actions">
          <button id="save-note" type="submit">추가</button>
          <button id="cancel-edit" class="secondary" type="button" hidden>수정 취소</button>
        </div>
      </form>
      <div id="note-status" class="status" aria-live="polite"></div>
    </section>

    <div class="notice">로그인하지 않은 요청은 401 JSON 오류로 거부됩니다. 한 건 조회·수정·삭제는 아직 소유자 확인을 하지 않아 4단계에서 보완할 예정입니다.</div>
    <ul id="notes" aria-live="polite"><li>로그인 후 가상 메모를 확인할 수 있습니다.</li></ul>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    const SUPABASE_URL = 'https://lktbmcgmnfcundifrvxs.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_5XCGZF2Z8jTqOgPXNKoQlQ_TlHywr3n';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const loginForm = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const authStatus = document.querySelector('#auth-status');
    const editorPanel = document.querySelector('#editor-panel');
    const noteForm = document.querySelector('#note-form');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const saveNote = document.querySelector('#save-note');
    const cancelEdit = document.querySelector('#cancel-edit');
    const noteStatus = document.querySelector('#note-status');
    const list = document.querySelector('#notes');

    let currentSession = null;
    let editingId = null;

    function renderMessage(message) {
      const item = document.createElement('li');
      item.textContent = message;
      list.replaceChildren(item);
    }

    function renderAuth(session) {
      const loggedIn = Boolean(session?.user);
      loginButton.hidden = loggedIn;
      logoutButton.hidden = !loggedIn;
      editorPanel.hidden = !loggedIn;
      document.querySelector('#email').disabled = loggedIn;
      document.querySelector('#password').disabled = loggedIn;
      authStatus.classList.remove('error');
      authStatus.textContent = loggedIn
        ? `로그인됨: ${session.user.email ?? '인증된 사용자'}`
        : '로그아웃 상태입니다.';
      if (!loggedIn) resetEditor();
    }

    function resetEditor() {
      editingId = null;
      noteForm.reset();
      document.querySelector('#editor-title').textContent = '가상 메모 추가';
      saveNote.textContent = '추가';
      cancelEdit.hidden = true;
      noteStatus.textContent = '';
      noteStatus.classList.remove('error');
    }

    async function apiRequest(path, options = {}) {
      if (!currentSession?.access_token) throw new Error('로그인이 필요합니다.');
      const headers = new Headers(options.headers || {});
      headers.set('Authorization', `Bearer ${currentSession.access_token}`);
      if (options.body && !headers.has('Content-Type')) headers.set('Content-Type', 'application/json');
      const response = await fetch(path, { ...options, headers, cache: 'no-store' });
      if (response.status === 204) return null;
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(data.error || `요청 실패 (HTTP ${response.status})`);
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function renderNotes(notes) {
      if (!notes.length) {
        renderMessage('내 가상 메모가 없습니다. 위에서 하나 추가해 보세요.');
        return;
      }
      list.replaceChildren(...notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const body = document.createElement('span');
        const actions = document.createElement('div');
        const edit = document.createElement('button');
        const remove = document.createElement('button');

        title.textContent = note.title;
        body.textContent = note.body;
        actions.className = 'note-actions';
        edit.className = 'secondary';
        edit.type = 'button';
        edit.textContent = '수정';
        remove.className = 'danger';
        remove.type = 'button';
        remove.textContent = '삭제';

        edit.addEventListener('click', async () => {
          noteStatus.textContent = '';
          try {
            const fresh = await apiRequest(`/api/notes/${encodeURIComponent(note.id)}`);
            editingId = fresh.id;
            noteTitle.value = fresh.title;
            noteBody.value = fresh.body;
            document.querySelector('#editor-title').textContent = '가상 메모 수정';
            saveNote.textContent = '수정 저장';
            cancelEdit.hidden = false;
            noteTitle.focus();
          } catch (error) {
            noteStatus.classList.add('error');
            noteStatus.textContent = error.message;
          }
        });

        remove.addEventListener('click', async () => {
          if (!confirm('이 가상 메모를 삭제할까요?')) return;
          noteStatus.classList.remove('error');
          noteStatus.textContent = '삭제 중입니다.';
          try {
            await apiRequest(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
            if (editingId === note.id) resetEditor();
            noteStatus.textContent = '삭제했습니다.';
            await loadNotes();
          } catch (error) {
            noteStatus.classList.add('error');
            noteStatus.textContent = error.message;
          }
        });

        actions.append(edit, remove);
        item.append(title, body, actions);
        return item;
      }));
    }

    async function loadNotes() {
      if (!currentSession?.access_token) {
        renderMessage('로그인 후 가상 메모를 확인할 수 있습니다.');
        return;
      }
      renderMessage('가상 메모를 불러오는 중입니다.');
      try {
        const notes = await apiRequest('/api/notes');
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        renderNotes(notes);
      } catch (error) {
        renderMessage(error.message);
      }
    }

    async function applySession(session) {
      currentSession = session;
      renderAuth(session);
      await loadNotes();
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      authStatus.classList.remove('error');
      authStatus.textContent = '로그인 확인 중입니다.';
      const email = document.querySelector('#email').value.trim();
      const password = document.querySelector('#password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        authStatus.classList.add('error');
        authStatus.textContent = `로그인 실패: ${error.message}`;
        return;
      }
      document.querySelector('#password').value = '';
      await applySession(data.session);
    });

    logoutButton.addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();
      if (error) {
        authStatus.classList.add('error');
        authStatus.textContent = `로그아웃 실패: ${error.message}`;
        return;
      }
      await applySession(null);
    });

    noteForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      noteStatus.classList.remove('error');
      noteStatus.textContent = editingId ? '수정 중입니다.' : '추가 중입니다.';
      const payload = { title: noteTitle.value, body: noteBody.value };
      try {
        if (editingId) {
          await apiRequest(`/api/notes/${encodeURIComponent(editingId)}`, {
            method: 'PUT',
            body: JSON.stringify(payload),
          });
          noteStatus.textContent = '수정했습니다.';
        } else {
          await apiRequest('/api/notes', {
            method: 'POST',
            body: JSON.stringify(payload),
          });
          noteStatus.textContent = '추가했습니다.';
        }
        resetEditor();
        await loadNotes();
      } catch (error) {
        noteStatus.classList.add('error');
        noteStatus.textContent = error.message;
      }
    });

    cancelEdit.addEventListener('click', resetEditor);

    const { data: { session } } = await supabase.auth.getSession();
    await applySession(session);
    supabase.auth.onAuthStateChange((_event, nextSession) => {
      void applySession(nextSession);
    });
  </script>
</body>
</html>
