<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    h2 { margin: 0 0 14px; font-size: 21px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice, .auth-card { margin: 26px 0; padding: 18px; border-radius: 14px; }
    .notice { border: 1px solid #d07384; color: #ffe3e8; background: #612a3544; }
    .auth-card { border: 1px solid #51667c; background: #152438; }
    .auth-grid { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; color: #dbe9f7; font-size: 14px; }
    input, textarea, button { font: inherit; }
    input, textarea { box-sizing: border-box; width: 100%; border: 1px solid #51667c; border-radius: 10px; background: #0f1b2a; color: #ecf4ff; padding: 11px 12px; }
    button { border: 0; border-radius: 10px; padding: 11px 14px; background: #8ad8df; color: #0a1724; font-weight: 700; cursor: pointer; }
    button.secondary { background: #31465d; color: #ecf4ff; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .status { min-height: 24px; margin-top: 12px; color: #bfd0e5; }
    .status.error { color: #ffb6c2; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인 보호</div>
    <h1>점령된 자료실</h1>
    <p>Supabase Auth로 로그인하고, 서버가 로그인 토큰을 검증한 뒤에만 가상 자료를 돌려줍니다.</p>

    <section class="auth-card" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <form id="login-form" class="auth-grid">
        <label>이메일
          <input id="email" name="email" type="email" autocomplete="username" required>
        </label>
        <label>비밀번호
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="actions">
          <button id="login-button" type="submit">로그인</button>
          <button id="logout-button" class="secondary" type="button" hidden>로그아웃</button>
        </div>
      </form>
      <div id="auth-status" class="status" aria-live="polite">로그아웃 상태입니다.</div>
    </section>

    <div class="notice">로그인 토큰이 없거나 검증에 실패하면 서버는 메모 없이 401 JSON 오류로 거부합니다.</div>
    <ul id="notes" aria-live="polite"><li>로그인 후 가상 자료를 확인할 수 있습니다.</li></ul>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    const SUPABASE_URL = 'https://lktbmcgmnfcundifrvxs.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_5XCGZF2Z8jTqOgPXNKoQlQ_TlHywr3n';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const loginForm = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const authStatus = document.querySelector('#auth-status');
    const list = document.querySelector('#notes');

    function renderAuth(session) {
      const loggedIn = Boolean(session?.user);
      loginButton.hidden = loggedIn;
      logoutButton.hidden = !loggedIn;
      document.querySelector('#email').disabled = loggedIn;
      document.querySelector('#password').disabled = loggedIn;
      authStatus.classList.remove('error');
      authStatus.textContent = loggedIn
        ? `로그인됨: ${session.user.email ?? '인증된 사용자'}`
        : '로그아웃 상태입니다.';
    }

    function renderMessage(message) {
      const item = document.createElement('li');
      item.textContent = message;
      list.replaceChildren(item);
    }

    async function loadNotes(session) {
      if (!session?.access_token) {
        renderMessage('로그인 후 가상 자료를 확인할 수 있습니다.');
        return;
      }
      renderMessage('가상 자료를 불러오는 중입니다.');
      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store',
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || '서버 자료를 읽을 수 없습니다.');
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (data.notes.length === 0) {
          renderMessage('표시할 가상 메모가 없습니다.');
          return;
        }
        list.replaceChildren(...data.notes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const body = document.createElement('span');
          title.textContent = note.title;
          body.textContent = note.content;
          item.append(title, body);
          return item;
        }));
      } catch (error) {
        renderMessage(error.message);
      }
    }

    async function applySession(session) {
      renderAuth(session);
      await loadNotes(session);
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      authStatus.classList.remove('error');
      authStatus.textContent = '로그인 확인 중입니다.';
      const email = document.querySelector('#email').value.trim();
      const password = document.querySelector('#password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        authStatus.classList.add('error');
        authStatus.textContent = `로그인 실패: ${error.message}`;
        return;
      }
      document.querySelector('#password').value = '';
      await applySession(data.session);
    });

    logoutButton.addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();
      if (error) {
        authStatus.classList.add('error');
        authStatus.textContent = `로그아웃 실패: ${error.message}`;
        return;
      }
      await applySession(null);
    });

    const { data: { session } } = await supabase.auth.getSession();
    await applySession(session);
    supabase.auth.onAuthStateChange((_event, nextSession) => {
      void applySession(nextSession);
    });
  </script>
</body>
</html>
